name: Publish compose demo image

on:
  push:
    branches: [main, fix/phase-0-2-first-run]
    paths:
      - docker/Dockerfile.compose
      - docker/compose-next.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build + push firn-explorer demo (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/firn-explorer
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=sha,prefix=sha-,format=short
            type=raw,value=demo,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.compose
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package visibility note
        run: |
          echo "Published ${{ steps.meta.outputs.tags }}"
          echo "For public on-ramp: set ghcr.io/${{ github.repository_owner }}/firn-explorer package visibility to public."
