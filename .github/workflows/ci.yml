name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    name: typecheck + lint + format + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The vendored openapi.json (./openapi.json) is the spec input
      # for orval. CI re-runs codegen against it and fails if any
      # generated file changed — catches "I changed the spec but
      # forgot to run pnpm codegen".
      #
      # Phase 2 will swap this for a path-checkout of firn so the
      # check pulls the live spec instead of trusting the vendored
      # copy. For now drift is caught at the spec-vendoring step
      # (sync-spec is a manual operator action; review enforces it).
      - name: Codegen drift
        run: |
          pnpm codegen
          if ! git diff --exit-code -- lib/api/generated openapi.json; then
            echo "::error::Generated API client is out of sync with openapi.json. Run 'pnpm sync-spec && pnpm codegen' locally and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec eslint . --max-warnings=0

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_FIRN_LOCAL: http://localhost:4000
