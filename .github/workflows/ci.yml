name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: typecheck + lint + format + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Type errors are hard fails — anything that compiled-out-of-skew
      # with the rest of the repo blocks merge.
      - name: Typecheck
        run: pnpm typecheck

      # Lint runs the firn-local/enforce-network-query-key rule among
      # others. New useQuery sites without network-scoped keys block CI;
      # see eslint-rules/enforce-network-query-key.js for the rationale
      # and `/* network-agnostic */` opt-out for legitimately-global
      # queries (Sourcify, openchain.xyz, 4byte.directory).
      - name: Lint
        run: pnpm lint

      # Prettier is a separate enforcement loop from ESLint —
      # eslint-config-prettier disables conflicting rules so the two
      # don't fight each other on whitespace.
      - name: Format check
        run: pnpm format:check

      # Final integration smoke: build the production bundle. Catches
      # SSR-time errors (server components, "use client" mismatches,
      # static-export incompatibilities) that lint + typecheck alone
      # don't see.
      - name: Build
        run: pnpm build
        env:
          # CI build doesn't need to talk to a real firn — env vars are
          # only read at runtime in the browser.
          NEXT_PUBLIC_FIRN_LOCAL: http://localhost:4000
